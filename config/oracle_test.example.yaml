oracle:
  # Instant Client Basic과 SQL*Plus를 같은 폴더에 압축 해제한 뒤 지정합니다.
  sqlplus_exe: "C:/oracle/instantclient_19_23/sqlplus.exe"
  username: "NETSCOUT_TEST"
  connect_identifier: "NETSCOUT_ORACLE"
  tns_admin: "./oracle_network"
  password_file: "./oracle.password"
  timeout_seconds: 120
  nls_lang: "KOREAN_KOREA.AL32UTF8"

query:
  # config 디렉터리를 기준으로 한 경로입니다.
  # SQL 파일을 직접 수정한 후 실행합니다.
  sql_file: "../query/hostname_lookup.sql"
